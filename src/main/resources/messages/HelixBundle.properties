# ------------------------------------------------------------------------------
# 1. General & Plugin Information
# ------------------------------------------------------------------------------
settings.displayName=Helix Keymap
status.widget.displayName=Helix Mode

# ------------------------------------------------------------------------------
# 2. Settings - Search and Prompt UI
# ------------------------------------------------------------------------------
settings.search.title=Search and Selection Prompt UI
settings.search.mode.stock=Stock Helix: Inline bottom bar with live search/select-as-you-type
settings.search.mode.popup=Popup Dialog: Floating centered dialog window
settings.search.history.label=Maximum prompt history entries per category (10 - 500):
settings.search.help=<html>Applies to <code>/</code> (search), <code>?</code> (reverse search), <code>s</code> (regex select), and <code>S</code> (regex split).<br/>In Stock Helix mode, matches and selections update live in the editor buffer as you type.<br/>Pressing <b>\u2191</b> / <b>\u2193</b> cycles through previously entered queries from the history ring.<br/>Pressing <b>Esc</b> cancels and restores original selections.</html>

# ------------------------------------------------------------------------------
# 3. Settings - Line Navigation
# ------------------------------------------------------------------------------
settings.lineNav.title=Line Navigation (Vertical Movement)
settings.lineNav.mode.stock=Stock Helix: j / k move by visual (screen) line, gj / gk move by physical line
settings.lineNav.mode.vim=Vim Standard: j / k move by physical document line, gj / gk move by visual line
settings.lineNav.help=<html>In Stock Helix, vertical movement (<code>j</code>/<code>k</code>) follows visual screen lines when soft-wrapping is enabled,<br/>while <code>gj</code>/<code>gk</code> jump by physical lines. Vim standard inverts this so <code>j</code>/<code>k</code> moves across physical lines.</html>

# ------------------------------------------------------------------------------
# 4. Settings - Which-Key Chord Menus
# ------------------------------------------------------------------------------
settings.whichKey.title=Which-Key Chord Menus
settings.whichKey.enable=Enable interactive Which-Key popups on chords (Space, g, m, [, ], z, Ctrl+w)
settings.whichKey.hint.helix=Show Helix command names (snake_case, e.g. file_picker, goto_definition)
settings.whichKey.hint.idea=Show IntelliJ action IDs (PascalCase, e.g. GotoFile, GotoDeclaration)
settings.whichKey.cols.3=Up to 3 columns: Compact height (shorter menu for widescreen monitors)
settings.whichKey.cols.2=Up to 2 columns: Classic width (narrower menu)
settings.whichKey.help=<html>When enabled, pausing on a chord prefix displays an interactive popup menu with actions.<br/>In the popup, pressing <b>Tab</b> switches between Helix commands and IntelliJ action IDs.<br/>Hovering over any row reveals its underlying IntelliJ Action ID in a tooltip.</html>

# ------------------------------------------------------------------------------
# 5. Settings - Jump List
# ------------------------------------------------------------------------------
settings.jumpList.title=Jump List
settings.jumpList.history.label=Maximum jump list entries per project (10 - 1000):
settings.jumpList.help=<html>Controls how many jump points are remembered for <code>Ctrl-O</code>, <code>Ctrl-I</code>, and <code>:jumps</code>.<br/>Older jump locations beyond this limit are automatically discarded.</html>

# ------------------------------------------------------------------------------
# 6. Settings - Color Theme
# ------------------------------------------------------------------------------
settings.theme.title=Color Theme
settings.theme.mode.sync=Sync with IDE: Automatically match IntelliJ''s light / dark appearance
settings.theme.mode.dark=Dark: Always use Helix dark theme (deep cyan / charcoal palette)
settings.theme.mode.light=Light: Always use Helix light theme (light teal / parchment palette)
settings.theme.help=<html>Applies to Which-Key popups, Command palette, Jump list, and Search / Regex prompts.</html>

# ------------------------------------------------------------------------------
# 7. Settings - Registers and Clipboard
# ------------------------------------------------------------------------------
settings.registers.title=Registers and Clipboard
settings.registers.syncClipboard=Sync default register with system clipboard (Helix behavior)
settings.registers.help=<html>When enabled, default yank (<code>y</code>) and delete (<code>d</code>/<code>c</code>) synchronize with the OS clipboard.<br/>Use <code>"_d</code> or <code>"_c</code> to delete/change without overwriting the clipboard.<br/>When disabled, default yank/delete stay in the internal register, and <code>Space+y</code> / <code>Space+p</code> (or <code>"+</code>) target the clipboard.</html>

# ------------------------------------------------------------------------------
# 8. Settings - Editor Behavior
# ------------------------------------------------------------------------------
settings.editorBehavior.title=Editor Behavior
settings.editorBehavior.resetToNormal=Reset to Normal mode when opening files or switching tabs
settings.editorBehavior.help=<html>When enabled, opening a file or switching editor tabs automatically enters <b>Normal</b> mode.<br/>When disabled, each editor tab retains its last active mode.</html>

