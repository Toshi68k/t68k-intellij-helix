settings.activation.otherEditors=Other embedded text editors (dialogs, evaluate expression)
settings.activation.help=<html>Controls which editor kinds enable Helix modal keybindings and block cursors.<br/>Single-line text fields, read-only viewers, and the built-in terminal are always excluded.</html>

