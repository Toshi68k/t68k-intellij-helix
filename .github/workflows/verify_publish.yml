name: Verify & Publish

on:
  schedule:
    - cron: '0 2 * * 0'
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  checks: write

jobs:
  verify:
    name: Verify Plugin
    runs-on: ubuntu-latest
    outputs:
      plugin_version: ${{ steps.version.outputs.plugin_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (7.0.1)
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6 (6.2.0)
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Cache Plugin Verifier IDEs and Layout Index
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6 (6.1.0)
        with:
          path: |
            ~/.pluginVerifier/ides
            .intellijPlatform/ides/layoutIndex
          key: ${{ runner.os }}-plugin-verifier-ides-${{ hashFiles('gradle.properties', 'build.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-plugin-verifier-ides-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6 (6.4.1)
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Determine Version
        id: version
        run: |
          RAW_TAG="${{ github.ref_name }}"
          # Strip leading 'v' if present (e.g. 'v0.2.0' -> '0.2.0')
          VERSION="${RAW_TAG#v}"
          if [ -z "$VERSION" ] || [ "${{ github.ref_type }}" = "branch" ]; then
            VERSION="0.1.0"
          fi
          echo "Determined plugin version: $VERSION"
          echo "plugin_version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Run unit tests and static analysis
        run: ./gradlew check -PpluginVersion="${{ steps.version.outputs.plugin_version }}"

      - name: Run plugin verifier
        run: ./gradlew verifyPlugin -PpluginVersion="${{ steps.version.outputs.plugin_version }}"

      - name: Publish test report
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6 (6.7.1)
        if: always()
        continue-on-error: true
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'

      - name: Upload built plugin to workflow
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7 (7.0.2)
        with:
          name: plugin-distribution
          path: build/distributions/*.zip
          if-no-files-found: error

  publish:
    name: Publish Plugin
    runs-on: ubuntu-latest
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    environment: marketplace
    env:
      CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
      PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
      PUBLISH_HIDDEN: ${{ contains(github.ref, '-rc') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (7.0.1)
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6 (6.2.0)
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6 (6.4.1)
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Determine release channels
        id: meta
        run: |
          if [[ "${{ github.ref_name }}" == *"-eap"* || "${{ github.ref_name }}" == *"-beta"* ]]; then
            echo "channels=eap" >> "$GITHUB_OUTPUT"
          else
            # Publishing stable to both default ("") and "eap" ensures EAP subscribers upgrade to final
            echo "channels=default,eap" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign and publish plugin to JetBrains Marketplace
        if: env.CERTIFICATE_CHAIN != '' && env.PRIVATE_KEY != ''
        env:
          PUBLISH_CHANNELS: ${{ steps.meta.outputs.channels }}
        run: ./gradlew publishPlugin -PpluginVersion="${{ needs.verify.outputs.plugin_version }}" --no-daemon

      - name: Upload signed plugin to workflow
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7 (7.0.2)
        with:
          name: plugin-signed
          path: build/distributions/*-signed.zip
          if-no-files-found: error

      - name: Upload signed plugin to GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3 (3.0.4)
        with:
          tag_name: ${{ github.ref_name }}
          files: build/distributions/*-signed.zip
          generate_release_notes: true
