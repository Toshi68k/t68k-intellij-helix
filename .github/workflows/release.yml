name: Build release asset

on:
  release:
    types: [ published ]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v0.1.0)'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Verify and Release Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (7.0.1)
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6 (6.0.1)
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Cache Plugin Verifier IDEs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6 (6.1.0)
        with:
          path: ~/.pluginVerifier/ides
          key: ${{ runner.os }}-plugin-verifier-ides
          restore-keys: |
            ${{ runner.os }}-plugin-verifier-ides-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@80e941e61874822d2a89974089c4915748e8f4b7 # v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Determine Version
        id: version
        run: |
          RAW_TAG="${{ inputs.tag_name || github.ref_name }}"
          # Strip leading 'v' if present (e.g. 'v0.2.0' -> '0.2.0')
          VERSION="${RAW_TAG#v}"
          if [ -z "$VERSION" ] || [ "${{ github.ref_type }}" = "branch" -a -z "${{ inputs.tag_name }}" ]; then
            VERSION="0.1.0"
          fi
          echo "Determined plugin version: $VERSION"
          echo "plugin_version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Test, Verify, and Build Plugin
        run: ./gradlew test verifyPlugin buildPlugin -PpluginVersion="${{ steps.version.outputs.plugin_version }}"

      - name: Sign Plugin
        if: env.CERTIFICATE_CHAIN != '' && env.PRIVATE_KEY != ''
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew signPlugin -PpluginVersion="${{ steps.version.outputs.plugin_version }}" --no-daemon

      - name: Upload Plugin to Workflow Run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7 (7.0.1)
        with:
          name: plugin-distribution
          path: build/distributions/*.zip
          if-no-files-found: error

      - name: Upload Plugin to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3 (3.0.3)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || (inputs.tag_name != null && inputs.tag_name != '')
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: build/distributions/*.zip
          generate_release_notes: true
