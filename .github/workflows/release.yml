name: Build plugin and release to JetBrains Marketplace

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v0.1.0)'
        required: false
        type: string
      hidden:
        description: 'Publish as hidden release on JetBrains Marketplace'
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Verify and Release Plugin
    runs-on: ubuntu-latest

    environment: marketplace

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (7.0.1)
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6 (6.2.0)
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Cache Plugin Verifier IDEs and Layout Index
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6 (6.1.0)
        with:
          path: |
            ~/.pluginVerifier/ides
            .intellijPlatform/ides/layoutIndex
          key: ${{ runner.os }}-plugin-verifier-ides-${{ hashFiles('gradle.properties', 'build.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-plugin-verifier-ides-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6 (6.4.1)
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Determine Version
        id: version
        run: |
          RAW_TAG="${{ inputs.tag_name || github.ref_name }}"
          # Strip leading 'v' if present (e.g. 'v0.2.0' -> '0.2.0')
          VERSION="${RAW_TAG#v}"
          if [ -z "$VERSION" ] || [ "${{ github.ref_type }}" = "branch" -a -z "${{ inputs.tag_name }}" ]; then
            VERSION="0.1.0"
          fi
          echo "Determined plugin version: $VERSION"
          echo "plugin_version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Test, Verify, and Build Plugin
        run: ./gradlew test verifyPlugin buildPlugin -PpluginVersion="${{ steps.version.outputs.plugin_version }}" --no-parallel

      - name: Determine release channels
        id: meta
        run: |
          if [[ "${{ github.ref_name }}" == *"-eap"* || "${{ github.ref_name }}" == *"-beta"* ]]; then
            echo "channels=eap" >> "$GITHUB_OUTPUT"
          else
            # Publishing stable to both default ("") and "eap" ensures EAP subscribers upgrade to final
            echo "channels=default,eap" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign and publish plugin to JetBrains Marketplace
        if: env.CERTIFICATE_CHAIN != '' && env.PRIVATE_KEY != ''
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          PUBLISH_HIDDEN: ${{ inputs.hidden || contains(github.ref, '-rc') }}
          PUBLISH_CHANNELS: ${{ steps.meta.outputs.channels }}
        run: ./gradlew publishPlugin -PpluginVersion="${{ steps.version.outputs.plugin_version }}" --no-daemon

      - name: Upload Plugin to Workflow Run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7 (7.0.2)
        with:
          name: plugin-distribution
          path: build/distributions/*-signed.zip
          if-no-files-found: error

      - name: Upload Plugin to GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3 (3.0.4)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || (inputs.tag_name != null && inputs.tag_name != '')
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: build/distributions/*-signed.zip
          generate_release_notes: true
