name: Build release asset

on:
  release:
    types: [ published ]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v0.1.0)'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'corretto'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Sanitize gradle.properties for CI
        run: |
          # Remove local machine-specific java.home if present so CI uses setup-java's JDK
          sed -i.bak '/org.gradle.java.home/d' gradle.properties || true

      - name: Determine Version
        id: version
        run: |
          RAW_TAG="${{ inputs.tag_name || github.ref_name }}"
          # Strip leading 'v' if present (e.g. 'v0.2.0' -> '0.2.0')
          VERSION="${RAW_TAG#v}"
          if [ -z "$VERSION" ] || [ "${{ github.ref_type }}" = "branch" -a -z "${{ inputs.tag_name }}" ]; then
            VERSION="0.1.0"
          fi
          echo "Determined plugin version: $VERSION"
          echo "plugin_version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build Plugin
        run: ./gradlew buildPlugin -PpluginVersion="${{ steps.version.outputs.plugin_version }}" -Dorg.gradle.java.home="$JAVA_HOME" --no-daemon

      - name: Upload Plugin to Workflow Run
        uses: actions/upload-artifact@v7
        with:
          name: plugin-distribution
          path: build/distributions/*.zip
          if-no-files-found: error

      - name: Upload Plugin to GitHub Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || (inputs.tag_name != null && inputs.tag_name != '')
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: build/distributions/*.zip
          generate_release_notes: true
