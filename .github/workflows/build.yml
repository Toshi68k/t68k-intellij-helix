name: Build and Verify Plugin

on:
  push:
    branches: [ main, 'feat/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Build, Test & Verify Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (7.0.1)
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6 (6.0.1)
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run Tests
        run: ./gradlew test --no-daemon

      - name: Upload Test Reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7 (7.0.1)
        with:
          name: test-reports
          path: build/reports/tests/

      - name: Run Detekt Static Analysis
        run: ./gradlew detekt --no-daemon

      - name: Verify Plugin Compatibility
        run: ./gradlew verifyPlugin --no-daemon

      - name: Build Plugin Package
        run: ./gradlew buildPlugin --no-daemon
