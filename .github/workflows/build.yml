name: Build and Verify Plugin

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Build, Test & Verify Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (7.0.1)
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6 (6.2.0)
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Cache Plugin Verifier IDEs and Layout Index
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6 (6.1.0)
        with:
          path: |
            ~/.pluginVerifier/ides
            .intellijPlatform/ides/layoutIndex
          key: ${{ runner.os }}-plugin-verifier-ides-${{ hashFiles('gradle.properties', 'build.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-plugin-verifier-ides-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6 (6.4.1)
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run Linter Checks
        run: ./gradlew spotlessCheck detekt

      - name: Run Tests
        run: ./gradlew test --build-cache --no-parallel

      - name: Build and Verify Plugin
        run: ./gradlew buildPlugin --build-cache --no-parallel

      - name: Verify Plugin Structure
        run: ./gradlew verifyPlugin --no-parallel

      - name: Upload Test Reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7 (7.0.2)
        with:
          name: test-reports
          path: build/reports/tests/
